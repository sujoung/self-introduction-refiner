<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intro Refiner</title>
<style>
  :root { --bg: #0b0f0c; --fg: #d7e0d9; --dim: #7c8a80; --accent: #5df28f; --error: #ff6b6b; --panel: #121914; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 ui-monospace, "JetBrains Mono", Menlo, monospace; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 18px; color: var(--accent); margin: 0 0 4px; }
  h1::before { content: "$ "; color: var(--dim); }
  .hint { color: var(--dim); margin: 0 0 24px; }
  button { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 8px 18px; font: inherit; cursor: pointer; margin-right: 8px; }
  button:disabled { color: var(--dim); border-color: var(--dim); cursor: default; }
  button:hover:not(:disabled) { background: var(--accent); color: var(--bg); }
  pre { background: var(--panel); border: 1px solid #1f2a22; padding: 16px; white-space: pre-wrap; min-height: 80px; margin-top: 16px; }
  .error { color: var(--error); }
  .status { color: var(--dim); margin-top: 12px; }
</style>
</head>
<body>
<main>
  <h1>intro-refiner</h1>
  <p class="hint">Press Start, introduce yourself in Swedish, press Stop.</p>
  <button id="start">Start</button>
  <button id="stop" disabled>Stop</button>
  <div class="status" id="status">idle</div>
  <pre id="transcript"></pre>
</main>
<script>
const RATE = 16000;
const startButton = document.getElementById('start');
const stopButton = document.getElementById('stop');
const status = document.getElementById('status');
const transcript = document.getElementById('transcript');
let context, processor, stream, chunks = [];

function setStatus(text, isError) {
  status.textContent = text;
  status.className = 'status' + (isError ? ' error' : '');
}

async function start() {
  chunks = [];
  transcript.textContent = '';
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (error) {
    setStatus('microphone: ' + error.message, true);
    return;
  }
  context = new AudioContext({ sampleRate: RATE });
  const source = context.createMediaStreamSource(stream);
  processor = context.createScriptProcessor(4096, 1, 1);
  processor.onaudioprocess = event => chunks.push(new Float32Array(event.inputBuffer.getChannelData(0)));
  const silence = context.createGain();
  silence.gain.value = 0;
  source.connect(processor);
  processor.connect(silence);
  silence.connect(context.destination);
  startButton.disabled = true;
  stopButton.disabled = false;
  setStatus('recording at ' + context.sampleRate + ' Hz');
}

async function stop() {
  stopButton.disabled = true;
  processor.disconnect();
  stream.getTracks().forEach(track => track.stop());
  const rate = context.sampleRate;
  await context.close();
  setStatus('transcribing...');
  const response = await fetch('/transcribe', { method: 'POST', body: toWav(chunks, rate) });
  const result = await response.json();
  if (!response.ok) {
    setStatus(result.error, true);
  } else {
    transcript.textContent = result.text;
    setStatus('done');
  }
  startButton.disabled = false;
}

function toWav(chunks, rate) {
  const samples = chunks.reduce((total, chunk) => total + chunk.length, 0);
  const buffer = new ArrayBuffer(44 + samples * 2);
  const view = new DataView(buffer);
  const ascii = (offset, text) => [...text].forEach((char, i) => view.setUint8(offset + i, char.charCodeAt(0)));
  ascii(0, 'RIFF'); view.setUint32(4, 36 + samples * 2, true); ascii(8, 'WAVE');
  ascii(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
  view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  ascii(36, 'data'); view.setUint32(40, samples * 2, true);
  let offset = 44;
  for (const chunk of chunks) for (const sample of chunk) {
    view.setInt16(offset, Math.max(-1, Math.min(1, sample)) * 0x7fff, true);
    offset += 2;
  }
  return buffer;
}

startButton.onclick = start;
stopButton.onclick = stop;
</script>
</body>
</html>
